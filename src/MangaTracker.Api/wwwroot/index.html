<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manga Tracker</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            font-family: system-ui, sans-serif;
            max-width: 820px;
            margin: 0 auto;
            padding: 24px 16px 64px;
            line-height: 1.5;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
            flex: 1;
        }

        h2 {
            font-size: 1.05rem;
            margin: 0 0 12px;
        }

        button {
            font: inherit;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #8884;
            background: #8881;
            cursor: pointer;
        }

            button:hover:not(:disabled) {
                background: #8883;
            }

            button:disabled {
                opacity: .5;
                cursor: default;
            }

            button.danger {
                border-color: #e5484d66;
                color: #e5484d;
            }

        input, select {
            font: inherit;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #8884;
            background: transparent;
            color: inherit;
        }

        #status {
            min-height: 1.5em;
            font-size: .9rem;
            opacity: .75;
            margin-bottom: 16px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid #8883;
            border-radius: 8px;
            margin-bottom: 8px;
        }

            li.unread {
                border-color: #4a9eff;
                background: #4a9eff14;
            }

            li.disabled {
                opacity: .55;
            }

        .info {
            flex: 1;
            min-width: 0;
        }

        .title {
            font-weight: 600;
        }

        .meta {
            font-size: .85rem;
            opacity: .7;
        }

        .badge {
            font-size: .75rem;
            background: #4a9eff;
            color: #fff;
            padding: 2px 8px;
            border-radius: 999px;
        }

            .badge.muted {
                background: #8886;
            }

        section {
            margin-top: 32px;
        }

        details > summary {
            cursor: pointer;
            font-weight: 600;
            padding: 8px 0;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: flex-start;
        }

            form .grow {
                flex: 1;
                min-width: 180px;
            }

            form .grow-2 {
                flex: 2;
                min-width: 240px;
            }

            form .full {
                flex-basis: 100%;
            }

        fieldset {
            border: 1px solid #8883;
            border-radius: 8px;
            padding: 12px;
            margin: 0 0 12px;
        }

        legend {
            font-size: .85rem;
            opacity: .7;
            padding: 0 6px;
        }

        #test-result {
            margin-top: 8px;
            font-size: .85rem;
            font-family: ui-monospace, monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }

            #test-result .ok {
                color: #46a758;
            }

            #test-result .fail {
                color: #e5484d;
            }

            #test-result .row {
                opacity: .8;
            }

        .hint {
            font-size: .8rem;
            opacity: .6;
            flex-basis: 100%;
            margin: -4px 0 4px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Manga Tracker</h1>
        <button id="check-all">Проверить</button>
    </header>

    <div id="status"></div>

    <ul id="list"></ul>

    <section>
        <h2>Добавить мангу</h2>
        <form id="add-manga-form">
            <input class="grow" name="title" placeholder="Название" required>
            <select name="sourceId" required></select>
            <input class="grow-2" name="sourceUrl" type="url" placeholder="Ссылка на страницу со списком глав" required>
            <button type="submit">Добавить</button>
        </form>
    </section>

    <section>
        <details id="sources-panel">
            <summary>Источники</summary>

            <ul id="sources-list"></ul>

            <fieldset>
                <legend>Новый источник</legend>

                <form id="add-source-form">
                    <input class="grow" name="name" placeholder="Название, например MangaShi" required>

                    <select name="kind" id="source-kind">
                        <option value="Html">HTML (разбор страницы)</option>
                        <option value="MangaLibApi">MangaLib API</option>
                    </select>

                    <select name="numberSource">
                        <option value="LinkTextThenHref">Номер: текст, затем ссылка</option>
                        <option value="LinkText">Номер: только текст</option>
                        <option value="Href">Номер: только ссылка</option>
                    </select>

                    <input class="full" name="chapterLinkSelector" placeholder="CSS-селектор ссылок на главы, например li.wp-manga-chapter a">
                    <input class="full" name="chapterNumberPattern" placeholder="Регулярка для номера (необязательно)">

                    <div class="hint">
                        Оставь регулярку пустой — номером станет первое число из текста ссылки или её адреса.
                    </div>

                    <input class="grow-2" name="testUrl" type="url" placeholder="Ссылка на любую мангу с этого сайта — для проверки">
                    <button type="button" id="test-selector">Проверить селектор</button>
                    <button type="submit">Сохранить источник</button>

                    <div id="test-result" class="full"></div>
                </form>
            </fieldset>
        </details>
    </section>

    <script src="app.js"></script>
</body>
</html>
