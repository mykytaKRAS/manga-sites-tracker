<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manga Tracker</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            font-family: system-ui, sans-serif;
            max-width: 780px;
            margin: 0 auto;
            padding: 24px 16px;
            line-height: 1.5;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
            flex: 1;
        }

        button {
            font: inherit;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #8884;
            background: #8881;
            cursor: pointer;
        }

            button:hover:not(:disabled) {
                background: #8883;
            }

            button:disabled {
                opacity: .5;
                cursor: default;
            }

        #status {
            min-height: 1.5em;
            font-size: .9rem;
            opacity: .75;
            margin-bottom: 16px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid #8883;
            border-radius: 8px;
            margin-bottom: 8px;
        }

            li.unread {
                border-color: #4a9eff;
                background: #4a9eff14;
            }

        .info {
            flex: 1;
            min-width: 0;
        }

        .title {
            font-weight: 600;
        }

        .meta {
            font-size: .85rem;
            opacity: .7;
        }

        .badge {
            font-size: .75rem;
            background: #4a9eff;
            color: #fff;
            padding: 2px 8px;
            border-radius: 999px;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 24px;
        }

        input, select {
            font: inherit;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #8884;
        }

            input[name="title"] {
                flex: 1;
                min-width: 160px;
            }

            input[name="sourceUrl"] {
                flex: 2;
                min-width: 220px;
            }
    </style>
</head>
<body>
    <header>
        <h1>Manga Tracker</h1>
        <button id="check-all">Проверить</button>
    </header>

    <div id="status"></div>

    <ul id="list"></ul>

    <form id="add-form">
        <input name="title" placeholder="Название" required>
        <select name="source">
            <option value="MangaLib">MangaLib</option>
            <option value="MangaShi">MangaShi</option>
            <option value="BluePeriodChapters">BluePeriod</option>
            <option value="RagnarokManga">Ragnarok</option>
            <option value="ReadHxh">ReadHxh</option>
        </select>
        <input name="sourceUrl" type="url" placeholder="Ссылка на список глав" required>
        <button type="submit">Добавить</button>
    </form>

    <script src="app.js"></script>
</body>
</html>
